spring.application.name=backend

# Optional first-run bootstrap. No built-in credentials; never overwrite an existing admin.
app.bootstrap-admin.full-name=${PUBLIC_FUND_ADMIN_NAME:}
app.bootstrap-admin.email=${PUBLIC_FUND_ADMIN_EMAIL:}
app.bootstrap-admin.password=${PUBLIC_FUND_ADMIN_PASSWORD:}

spring.datasource.url=${PUBLIC_FUND_DB_URL:jdbc:mysql://localhost:3306/public_fund_db}
spring.datasource.username=${PUBLIC_FUND_DB_USERNAME:root}
spring.datasource.password=${PUBLIC_FUND_DB_PASSWORD}
app.jwt.secret=${PUBLIC_FUND_JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=101MB
server.tomcat.max-http-form-post-size=25MB

# Optional machine-local, untracked integration settings; no credentials in Java source.
spring.config.import=optional:file:./config/local.properties
